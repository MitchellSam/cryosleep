# Render Blueprint — the source of truth for this project's server infrastructure.
# Blueprints can only be CREATED from the Render dashboard (New → Blueprint); the API
# is read-only for them. Once linked, edit this file, commit, and sync from the dashboard.
#
# Free plan sleeps after ~15 min idle; the first connection wakes it (~30-60s).
services:
  - type: web
    name: cryosleep-server
    runtime: node
    plan: free
    region: ohio
    branch: main
    autoDeploy: true
    # Dev dependencies are required: the server runs through tsx.
    buildCommand: npm ci --include=dev
    startCommand: npm start --workspace @cryosleep/server
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    # No healthCheckPath: the server exposes only socket.io, no plain HTTP route.
